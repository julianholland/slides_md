[project]
name = "slide-maker"
version = "0.1.0"
description = "Markdown + YAML frontmatter to static HTML slide deck generator"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "markdown-it-py>=3.0",
    "jinja2>=3.1",
]

[project.scripts]
slide-maker = "slide_maker.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["slide_maker*"]

[tool.setuptools.package-data]
slide_maker = ["templates/*.jinja", "assets/*", "vendor/**/*"]
