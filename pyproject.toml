[project]
name = "slide-maker"
version = "0.1.0"
description = "Markdown + YAML frontmatter to static HTML slide deck generator"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "markdown-it-py>=3.0",
    "jinja2>=3.1",
]

[project.scripts]
slide-maker = "slide_maker.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6", "pypdf>=4.0"]
docs = ["sphinx>=6.0", "sphinx-rtd-theme>=1.2", "myst-parser>=0.18"]
pdf = ["playwright>=1.40"]
pdf-images = ["PyMuPDF>=1.23"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["slide_maker*"]

[tool.setuptools.package-data]
slide_maker = ["templates/*.jinja", "assets/**/*", "vendor/**/*", "placeholder_images/*.png"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Deliberately modest baseline for a project with no prior lint history: real-bug
# rules (pyflakes) and import ordering (isort), not style/annotation opinions
# (docstrings, type-hints, datetime-timezone, etc.) that would need a separate,
# larger cleanup pass to adopt.
select = ["E4", "E7", "E9", "F", "I"]
