[build-system]
requires = ["hatchling>=1.26", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "Deckoction-md"
dynamic = ["version"]
description = "Markdown + YAML frontmatter to static HTML slide deck generator"
readme = "README.md"
authors = [
    {name = "Julian Holland", email = "holland@fhi.mpg.de"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Presentation",
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "markdown-it-py>=3.0",
    "jinja2>=3.1",
]

[project.scripts]
deckoction = "deckoction.cli:main"
slides_md = "deckoction.cli:serve_main"

[project.optional-dependencies]
# Extras (not dependency groups) so end users can `uv tool install 'deckoction-md[pdf]'`
# and Read the Docs can install `docs`.
docs = ["sphinx>=6.0", "sphinx-rtd-theme>=1.2", "myst-parser>=0.18"]
pdf = ["playwright>=1.40"]
pdf-images = ["PyMuPDF>=1.23"]

# Development-only dependencies (PEP 735). `uv sync` installs the `dev`
# group by default; never part of the published package.
[dependency-groups]
dev = ["pytest>=7.0", "ruff>=0.6", "pypdf>=4.0"]

[project.urls]
Homepage = "https://github.com/julianholland/slides_md"
Repository = "https://github.com/julianholland/slides_md"
Documentation = "https://slides-md.readthedocs.io"

# Version from git tags (vMAJOR.MINOR.PATCH).
[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "post-release", local_scheme = "no-local-version" }

# Non-Python package files (templates, assets, vendored KaTeX, placeholder PNGs) are
# included because they live inside the package directory.
[tool.hatch.build.targets.wheel]
packages = ["deckoction"]

[tool.hatch.build.targets.sdist]
include = [
    "deckoction",
    "tests",
    "docs",
    "examples",
    "README.md",
    "CHANGELOG.md",
    "pyproject.toml",
]
exclude = ["**/__pycache__", "docs/_build", "docs/_static/demo", "examples/**/build"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Deliberately modest baseline for a project with no prior lint history: real-bug
# rules (pyflakes) and import ordering (isort), not style/annotation opinions
# (docstrings, type-hints, datetime-timezone, etc.) that would need a separate,
# larger cleanup pass to adopt.
select = ["E4", "E7", "E9", "F", "I"]
